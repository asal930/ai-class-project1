<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 بازی فعل ماضی عربی - ۱۵ سطح</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
        body { background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab); background-size: 400% 400%; animation: gradient 15s ease infinite; height: 100vh; }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .start-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .start-screen h1 { font-size: 2.8em; margin-bottom: 20px; animation: glow 2s ease-in-out infinite alternate; }
        @keyframes glow { from { text-shadow: 0 0 20px #fff, 0 0 30px #fff, 0 0 40px #ff00de; } to { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ff00de, 0 0 40px #ff00de; } }
        input[type="text"] { padding: 15px 25px; font-size: 1.3em; border: 3px solid rgba(255,255,255,0.3); border-radius: 50px; width: 280px; text-align: center; margin: 25px 0; background: rgba(255,255,255,0.9); }
        .start-btn { padding: 20px 60px; font-size: 1.6em; background: linear-gradient(45deg, #ff6b6b, #ffd93d); border: none; border-radius: 50px; color: #333; cursor: pointer; box-shadow: 0 15px 35px rgba(0,0,0,0.3); transition: all 0.3s; font-weight: bold; }
        .start-btn:hover { transform: translateY(-5px); box-shadow: 0 25px 50px rgba(0,0,0,0.4); }

        .game-screen { display: none; height: 100vh; position: relative; }
        .header { background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .player-info { display: flex; gap: 20px; align-items: center; }
        .player-name { font-size: 1.2em; font-weight: bold; }
        .level { background: linear-gradient(45deg, #ffd700, #ffed4e); color: #333; padding: 8px 16px; border-radius: 25px; font-weight: bold; }
        .score { font-size: 1.4em; background: linear-gradient(45deg, #00d2d3, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        .timer { font-size: 1.4em; color: #ff4757; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .game-area { height: calc(100vh - 90px); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .current-question { background: rgba(255,255,255,0.95); padding: 30px 40px; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); margin-bottom: 40px; }
        .verb-display { font-size: 3.5em; font-weight: bold; color: #e74c3c; text-align: center; margin-bottom: 10px; }
        .pronoun-display { font-size: 2em; color: #2c3e50; text-align: center; }

        .pronouns-keyboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 600px; width: 90%; padding: 25px; background: rgba(255,255,255,0.95); border-radius: 30px; box-shadow: 0 25px 70px rgba(0,0,0,0.3); backdrop-filter: blur(20px); }
        .pronoun-btn { padding: 18px 10px; font-size: 1.4em; font-weight: bold; border: 3px solid #e0e0e0; border-radius: 20px; cursor: pointer; transition: all 0.3s; background: linear-gradient(45deg, #f8f9fa, #e9ecef); color: #495057; }
        .pronoun-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(0,0,0,0.2); border-color: #007bff; }
        .pronoun-btn:active { transform: scale(0.95); }
        .pronoun-btn.correct { background: linear-gradient(45deg, #56ab2f, #a8e6cf) !important; border-color: #56ab2f !important; color: white; animation: correctAnim 0.6s; }
        .pronoun-btn.wrong { background: linear-gradient(45deg, #ff416c, #ff4b2b) !important; border-color: #ff416c !important; color: white; animation: wrongAnim 0.5s; }
        @keyframes correctAnim { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes wrongAnim { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        .result-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .result-content { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 50px; border-radius: 40px; text-align: center; box-shadow: 0 30px 100px rgba(0,0,0,0.5); transform: scale(0.7); animation: modalPop 0.5s forwards; max-width: 400px; }
        @keyframes modalPop { to { transform: scale(1); } }
        .final-score { font-size: 4.5em; margin: 20px 0; background: linear-gradient(45deg, #ffd700, #ffed4e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .play-again { padding: 18px 50px; font-size: 1.4em; background: linear-gradient(45deg, #ffecd2, #fcb69f); color: #333; border: none; border-radius: 30px; cursor: pointer; margin-top: 25px; font-weight: bold; box-shadow: 0 15px 40px rgba(0,0,0,0.3); transition: all 0.3s; }
        .play-again:hover { transform: translateY(-5px); box-shadow: 0 25px 60px rgba(0,0,0,0.4); }

        @media (max-width: 768px) {
            .pronouns-keyboard { grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; }
            .verb-display { font-size: 2.8em; }
            .pronoun-display { font-size: 1.6em; }
            .pronoun-btn { font-size: 1.2em; padding: 15px 8px; }
        }
    </style>
</head>
<body>
    <!-- صفحه شروع -->
    <div class="start-screen" id="startScreen">
        <h1>🎮 فعل ماضی عربی</h1>
        <p style="font-size: 1.6em; margin-bottom: 40px; opacity: 0.9;">۱۵ سطح هیجان‌انگیز + تایمر + امتیاز ۱۰!</p>
        <input type="text" id="playerName" placeholder="👤 نام خود را وارد کنید" maxlength="15">
        <button class="start-btn" onclick="startGame()">🚀 شروع بازی فوق‌العاده!</button>
    </div>

    <!-- صفحه بازی -->
    <div class="game-screen" id="gameScreen">
        <div class="header">
            <div class="player-info">
                <span class="player-name" id="gamePlayerName">-</span>
                <span class="level" id="currentLevel">سطح ۱</span>
            </div>
            <div style="display: flex; gap: 20px;">
                <div class="score">⭐ <span id="currentScore">0</span>/۱۰</div>
                <div class="timer" id="timer">⏰ ۹۰</div>
            </div>
        </div>

        <div class="game-area">
            <div class="current-question">
                <div class="verb-display" id="currentVerb">-</div>
                <div class="pronoun-display" id="currentPronoun">-</div>
            </div>
        </div>

        <div class="pronouns-keyboard" id="pronounsKeyboard"></div>
    </div>

    <!-- نتیجه نهایی -->
    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <h2>🏆 بازی تمام شد!</h2>
            <div class="final-score" id="finalScore">0</div>
            <p style="font-size: 1.3em; margin: 20px 0;">امتیاز نهایی: <span id="finalScoreText">0</span> از ۱۰</p>
            <button class="play-again" onclick="restartGame()">🔄 بازی دوباره</button>
        </div>
    </div>

    <script>
        // ۱۵ ترکیب تصادفی از ۵ فعل
        const verbs = ['ذَهَبَ', 'فَرِحَ', 'وَجَدَ', 'کَتَبَ', 'شَهِدَ'];
        const pronouns = ['أَنَا', 'أَنْتَ', 'أَنْتِ', 'هُوَ', 'هِیَ', 'نَحْنُ', 'أَنْتُمَا', 'أَنْتُمْ', 'هُمْ', 'أَنْتُنَّ', 'هُنَّ'];
        
        const correctAnswers = {
            'ذَهَبَ': ['ذَهَبْتُ', 'ذَهَبْتَ', 'ذَهَبْتِ', 'ذَهَبَ', 'ذَهَبَتْ', 'ذَهَبْنَا', 'ذَهَبْتُمَا', 'ذَهَبْتُمْ', 'ذَهَبُوا', 'ذَهَبْتُنَّ', 'ذَهَبْنَ'],
            'فَرِحَ': ['فَرِحْتُ', 'فَرِحْتَ', 'فَرِحْتِ', 'فَرِحَ', 'فَرِحَتْ', 'فَرِحْنَا', 'فَرِحْتُمَا', 'فَرِحْتُمْ', 'فَرِحُوا', 'فَرِحْتُنَّ', 'فَرِحْنَ'],
            'وَجَدَ': ['وَجَدْتُ', 'وَجَدْتَ', 'وَجَدْتِ', 'وَجَدَ', 'وَجَدَتْ', 'وَجَدْنَا', 'وَجَدْتُمَا', 'وَجَدْتُمْ', 'وَجَدُوا', 'وَجَدْتُنَّ', 'وَجَدْنَ'],
            'کَتَبَ': ['کَتَبْتُ', 'کَتَبْتَ', 'کَتَبْتِ', 'کَتَبَ', 'کَتَبَتْ', 'کَتَبْنَا', 'کَتَبْتُمَا', 'کَتَبْتُمْ', 'کَتَبُوا', 'کَتَبْتُنَّ', 'کَتَبْنَ'],
            'شَهِدَ': ['شَهِدْتُ', 'شَهِدْتَ', 'شَهِدْتِ', 'شَهِدَ', 'شَهِدَتْ', 'شَهِدْنَا', 'شَهِدْتُمَا', 'شَهِدْتُمْ', 'شَهِدُوا', 'شَهِدْتُنَّ', 'شَهِدْنَ']
        };

        let questions = [], currentQuestionIndex = 0, currentScore = 0, timeLeft = 90, gameActive = false;
        let timerInterval;

        // تولید ۱۵ سوال تصادفی
        function generateQuestions() {
            questions = [];
            const usedCombos = new Set();
            while (questions.length < 15) {
                const randomVerbIndex = Math.floor(Math.random() * verbs.length);
                const randomPronounIndex = Math.floor(Math.random() * pronouns.length);
                const combo = `${randomVerbIndex}-${randomPronounIndex}`;
                if (!usedCombos.has(combo)) {
                    usedCombos.add(combo);
                    questions.push({
                        verb: verbs[randomVerbIndex],
                        pronoun: pronouns[randomPronounIndex],
                        answer: correctAnswers[verbs[randomVerbIndex]][randomPronounIndex]
                    });
                }
            }
            shuffleArray(questions);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startGame() {
            const playerName = document.getElementById('playerName').value || 'بازیکن ناشناس';
            document.getElementById('playerName').value = '';
            document.getElementById('gamePlayerName').textContent = playerName;
            
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            
            generateQuestions();
            currentQuestionIndex = 0;
            currentScore = 0;
            timeLeft = 90;
            gameActive = true;
            
            updateScore();
            nextQuestion();
            startTimer();
        }

        function nextQuestion() {
            if (currentQuestionIndex >= 10) { // فقط ۱۰ سوال برای امتیاز ۱۰
                endGame();
                return;
            }
            
            const q = questions[currentQuestionIndex];
            document.getElementById('currentVerb').textContent = q.verb;
            document.getElementById('currentPronoun').textContent = q.pronoun;
            document.getElementById('currentLevel').textContent = `سطح ${currentQuestionIndex + 1}`;
            
            createPronounButtons(q.answer);
        }

        function createPronounButtons(correctAnswer) {
            const container = document.getElementById('pronounsKeyboard');
            container.innerHTML = '';
            
            // همه جواب‌های ممکن + جواب درست
            const allForms = [];
            verbs.forEach(verb => {
                pronouns.forEach(pronoun => {
                    allForms.push(correctAnswers[verb][pronouns.indexOf(pronoun)]);
                });
            });
            
            // مخلوط کردن
            shuffleArray(allForms);
            const buttonsToShow = allForms.slice(0, 12); // ۱۲ دکمه
            if (!buttonsToShow.includes(correctAnswer)) {
                buttonsToShow[0] = correctAnswer;
            }
            shuffleArray(buttonsToShow);
            
            buttonsToShow.forEach(form => {
                const btn = document.createElement('button');
                btn.className = 'pronoun-btn';
                btn.textContent = form;
                btn.onclick = () => checkAnswer(form, correctAnswer);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (!gameActive) return;
            
            const buttons = document.querySelectorAll('.pronoun-btn');
            buttons.forEach(btn => {
                if (btn.textContent === correct) {
                    btn.classList.add('correct');
                } else if (btn.textContent === selected && selected !== correct) {
                    btn.classList.add('wrong');
                }
            });
            
            if (selected === correct) {
                currentScore++;
                updateScore();
            }
            
            gameActive = false;
            setTimeout(() => {
                currentQuestionIndex++;
                gameActive = true;
                nextQuestion();
            }, 1000);
        }

        function updateScore() {
            document.getElementById('currentScore').textContent = currentScore;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            document.getElementById('finalScore').textContent = currentScore;
            document.getElementById('finalScoreText').textContent = currentScore;
            document.getElementById('resultModal').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('resultModal').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'flex';
        }
    </script>
</body>
</html>
